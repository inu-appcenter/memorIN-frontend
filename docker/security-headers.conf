# 정적 파일 응답에 붙이는 보안 헤더. default.conf.template의 정적 location마다 include한다.
# nginx는 location 안에 add_header가 하나라도 있으면 server 블록의 add_header를 물려받지
# 않는다. 그래서 server 블록에 한 번 적는 대신 이 파일을 location마다 불러온다.
# /api, /auth, /ws는 backend(Spring Security)가 같은 헤더를 붙이므로 여기서 더하지 않는다.

# 다른 사이트가 이 페이지를 iframe에 넣지 못하게 한다(클릭재킹 방지).
# X-Frame-Options는 frame-ancestors를 모르는 오래된 브라우저용이다.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
# 브라우저가 Content-Type을 무시하고 내용으로 파일 종류를 추측하지 않게 한다.
add_header X-Content-Type-Options "nosniff" always;
# 외부 사이트로 이동할 때 /post/<id> 같은 경로는 빼고 출처(도메인)만 보낸다.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

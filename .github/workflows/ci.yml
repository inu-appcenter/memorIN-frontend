name: CI

# main으로 가는 PR을 검증한다.
# 목적은 "타입 오류가 있는 코드가 main에 머지되는 것"을 막는 것이다.
# main에 직접 push(=PR 머지)되면 image job이 추가로 돌아 GHCR에 이미지를 올린다.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: 타입 체크
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      # Dockerfile 빌더 스테이지와 동일한 버전을 써서 "CI는 통과했는데 이미지 빌드는
      # 실패"하는 버전 불일치를 없앤다.
      # check-latest: 러너에 캐시된 예전 24.x 대신 최신 24.x(보안 패치 포함)를 받는다.
      # Dockerfile의 node:24-alpine도 최신 24.x를 가리키므로 두 쪽 버전이 맞는다.
      - name: Node 24 설정 (의존성 캐시 포함)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npm run typecheck

      - name: Lint 체크
        if:
          hashFiles('eslint.config.js', 'eslint.config.mjs', '.eslintrc.js',
          '.eslintrc.json', '.eslintrc.cjs') != ''
        run: npm run lint

  pr-title:
    name: PR 제목 컨벤션 검사
    runs-on: ubuntu-latest
    # push 이벤트에는 github.event.pull_request가 없어 빈 문자열이 되고 항상 실패한다.
    # PR에서만 의미 있는 검사이므로 PR 이벤트에서만 돈다.
    if: github.event_name == 'pull_request'

    steps:
      - name: '형식 확인 (type: 설명)'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^(feat|fix|chore|refactor|docs|test|style|perf)(\([a-z0-9-]+\))?:\ .+ ]]; then
            echo "::error::PR 제목이 컨벤션을 따르지 않습니다: \"$TITLE\""
            echo "형식: <type>: <설명>  (예: feat: 로그인 기능 추가)"
            echo "허용 타입: feat, fix, chore, refactor, docs, test, style, perf"
            exit 1
          fi
          echo "OK: $TITLE"

  image-check:
    name: 이미지 빌드 검증
    # PR에서는 푸시 없이 빌드만 해 본다. 지금까지는 main 머지 뒤에만 이미지를 빌드해서
    # Dockerfile이나 nginx 템플릿이 깨져도 머지 후에야 알 수 있었다.
    # 제목만 바꾼 경우(edited)에는 다시 빌드하지 않는다.
    if: github.event_name == 'pull_request' && github.event.action != 'edited'
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: 빌드 (푸시 안 함)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha

  image:
    name: 이미지 빌드 및 GHCR 푸시
    # typecheck를 통과한 커밋만 이미지가 된다.
    needs: [typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 메타데이터 (태그·라벨)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/memorin-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

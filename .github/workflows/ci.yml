name: CI

# main으로 가는 PR을 검증한다.
# 목적은 "타입 오류가 있는 코드가 main에 머지되는 것"을 막는 것이다.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: 타입 체크
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: Node 20 설정 (의존성 캐시 포함)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npm run typecheck

      - name: Lint 체크
        if:
          hashFiles('eslint.config.js', 'eslint.config.mjs', '.eslintrc.js',
          '.eslintrc.json', '.eslintrc.cjs') != ''
        run: npm run lint

  pr-title:
    name: PR 제목 컨벤션 검사
    runs-on: ubuntu-latest

    steps:
      - name: '형식 확인 (type: 설명)'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^(feat|fix|chore|refactor|docs|test|style|perf)(\([a-z0-9-]+\))?:\ .+ ]]; then
            echo "::error::PR 제목이 컨벤션을 따르지 않습니다: \"$TITLE\""
            echo "형식: <type>: <설명>  (예: feat: 로그인 기능 추가)"
            echo "허용 타입: feat, fix, chore, refactor, docs, test, style, perf"
            exit 1
          fi
          echo "OK: $TITLE"
